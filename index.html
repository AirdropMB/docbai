<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đọc chính tả</title>
<style>
:root{--bg:#faf9f6;--card:#fff;--text:#1f1d1a;--muted:#6b665e;--line:#ddd8cf;--accent:#c4623f;--accent-t:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--card:#262421;--text:#f0ede6;--muted:#a09a8f;--line:#3a3732}}
:root[data-theme="dark"]{--bg:#1b1a18;--card:#262421;--text:#f0ede6;--muted:#a09a8f;--line:#3a3732}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--bg);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
input[type=number],input[type=text],select{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
input[type=range]{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.now{font-size:1.5rem;text-align:center;padding:22px 10px;min-height:80px;display:flex;align-items:center;justify-content:center}
.nl{text-align:center;font-weight:600;color:var(--accent);min-height:1.5em}
.status{text-align:center;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--accent);transition:width .2s}
.chk{flex-direction:row;align-items:center;gap:6px;font-size:.9rem;color:var(--text)}
</style>
</head>
<body>
<main>
<h1>Đọc chính tả</h1>
<p class="sub">Dán văn bản, chọn số từ mỗi lần đọc và số lần lặp, rồi bấm Bắt đầu.</p>

<div class="card">
<textarea id="text" placeholder="Dán hoặc nhập văn bản vào đây..."></textarea>
<div class="row" style="margin-top:10px">
<button onclick="makeLink()">🔗 Tạo link chia sẻ</button>
<input type="text" id="link" readonly placeholder="Link sẽ hiện ở đây" style="flex:1;min-width:160px" onclick="this.select()">
<button onclick="copyLink()" id="cp">Sao chép</button>
</div>
<div class="status" id="shmsg" style="text-align:left;margin-top:6px"></div>
</div>

<div class="card">
<div class="grid">
<label>Số từ mỗi lần<input type="number" id="min" value="4" min="1" max="50"></label>
<label>Lặp lại (lần)<input type="number" id="rep" value="2" min="1" max="20"></label>
<label>Nghỉ giữa các lần lặp (giây)<input type="number" id="p1" value="3" min="0" step="0.5"></label>
<label>Nghỉ trước cụm kế tiếp (giây)<input type="number" id="p2" value="4" min="0" step="0.5"></label>
<label style="grid-column:1/-1">Bắt đầu đọc từ chữ/cụm từ (tùy chọn, để trống = đọc từ đầu)<input type="text" id="kw" placeholder="ví dụ: Tây Tiến"></label>
</div>
<div class="grid" style="margin-top:10px">
<label>Giọng đọc<select id="voice"></select></label>
<label>Tốc độ: <span id="rv">0.9</span><input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.9"></label>
</div>
<div class="row" style="margin-top:10px">
<label class="chk"><input type="checkbox" id="show" checked> Hiện cụm đang đọc</label>
<label class="chk"><input type="checkbox" id="sayNl" checked> Đọc to "xuống dòng" khi hết dòng</label>
</div>
</div>

<div class="card">
<div class="now" id="now">—</div>
<div class="nl" id="nl"></div>
<div class="bar"><div id="prog"></div></div>
<div class="status" id="status">Sẵn sàng</div>
<div class="row" style="justify-content:center;margin-top:12px">
<button onclick="prev()">⏮</button>
<button class="primary" id="go" onclick="startPlay()">▶ Bắt đầu</button>
<button onclick="pauseResume()" id="pz">⏸ Tạm dừng</button>
<button onclick="stopAll()">⏹ Dừng</button>
<button onclick="next()">⏭</button>
</div>
</div>
</main>
<script>
var chunks=[],idx=0,rep=0,state='stop',timer=null,token=0;
var $=function(i){return document.getElementById(i)};
var voices=[],player=null,wd=null,startNote='',breaks=[];
function loadVoices(){
  voices=('speechSynthesis' in window)?speechSynthesis.getVoices():[];
  var sel=$('voice'),cur=sel.value||'online';sel.innerHTML='';
  var o0=document.createElement('option');o0.value='online';o0.textContent='Giọng tiếng Việt online (dùng được mọi máy)';sel.appendChild(o0);
  voices.map(function(v,i){return{v:v,i:i}}).forEach(function(o){var op=document.createElement('option');op.value=o.i;op.textContent='Giọng máy: '+o.v.name+' ('+o.v.lang+')';sel.appendChild(op)});
  sel.value=cur;
}
loadVoices();
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices}
$('rate').oninput=function(){$('rv').textContent=this.value};

function normA(w){return w.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')}
function normB(w){return w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^\p{L}\p{N}]/gu,'')}
function findStart(words,kw,norm){
  var toks=kw.trim().split(/\s+/).map(norm).filter(Boolean);
  if(!toks.length)return -1;
  var L=[];words.forEach(function(w,i){var n=norm(w);if(n)L.push({i:i,n:n})});
  for(var p=0;p+toks.length<=L.length;p++){
    var ok=true;for(var q=0;q<toks.length;q++){if(L[p+q].n!==toks[q]){ok=false;break}}
    if(ok)return L[p].i;
  }
  return -1;
}
function build(){
  var lines=$('text').value.split(/\r?\n/),items=[],blank=0;
  lines.forEach(function(ln){
    var ws=ln.trim().split(/\s+/).filter(Boolean);
    if(!ws.length){blank++;return}
    if(items.length)items[items.length-1].br=blank>0?2:1;
    blank=0;
    ws.forEach(function(w){items.push({w:w,br:0})});
  });
  startNote='';
  var kw=($('kw').value||'').trim();
  if(kw&&items.length){
    var strs=items.map(function(x){return x.w});
    var st=findStart(strs,kw,normA);
    if(st<0)st=findStart(strs,kw,normB);
    if(st<0)return 'Không tìm thấy "'+kw+'" trong văn bản.';
    items=items.slice(st);
    startNote=' · bắt đầu từ "'+kw+'"';
  }
  var a=Math.max(1,parseInt($('min').value)||1),i=0;
  chunks=[];breaks=[];
  while(i<items.length){
    var parts=[],br=0,j=0;
    while(j<a&&i<items.length){var it=items[i++];parts.push(it.w);j++;if(it.br){br=it.br;break}}
    chunks.push(parts.join(' '));breaks.push(br);
  }
  return true;
}
function ui(){
  $('nl').textContent='';
  var r=Math.max(1,parseInt($('rep').value)||1);
  $('now').textContent=chunks.length&&$('show').checked?chunks[idx]||'—':(chunks.length?'• • •':'—');
  $('prog').style.width=chunks.length?(idx/chunks.length*100)+'%':'0';
  $('status').textContent=chunks.length?('Cụm '+Math.min(idx+1,chunks.length)+'/'+chunks.length+' · lần đọc '+Math.min(rep+1,r)+'/'+r+startNote):'Sẵn sàng';
}
function say(text,my,cb){
  var done=function(){
    clearTimeout(wd);
    if(my!==token||state!=='play')return;
    cb();
  };
  if($('voice').value==='online'){
    if(!player)player=new Audio();
    var clients=['tw-ob','gtx'];
    var tryPlay=function(k){
      if(my!==token)return;
      var failed=false;
      var fail=function(){
        if(failed||my!==token)return;failed=true;
        if(k+1<clients.length){tryPlay(k+1);return}
        clearTimeout(wd);state='pause';$('pz').textContent='▶ Tiếp tục';
        $('status').textContent='Không tải được giọng online. Kiểm tra mạng, bấm Tiếp tục để thử lại hoặc chọn giọng máy.';
      };
      clearTimeout(wd);
      player.onended=null;player.onerror=null;
      player.src='https://translate.google.com/translate_tts?ie=UTF-8&client='+clients[k]+'&tl=vi&q='+encodeURIComponent(text);
      player.defaultPlaybackRate=player.playbackRate=parseFloat($('rate').value);
      player.onended=done;
      player.onerror=fail;
      wd=setTimeout(function(){if(my===token&&state==='play')done()},25000);
      var p=player.play();
      if(p&&p.catch)p.catch(function(e){
        if(my!==token)return;
        if(e&&e.name==='AbortError')return;
        if(e&&e.name==='NotAllowedError'){
          clearTimeout(wd);state='pause';$('pz').textContent='▶ Tiếp tục';
          $('status').textContent='Trình duyệt chặn tự phát âm thanh. Bấm Tiếp tục để đọc tiếp.';
          return;
        }
        fail();
      });
    };
    tryPlay(0);
    return;
  }
  var u=new SpeechSynthesisUtterance(text);
  var v=voices[$('voice').value];
  if(v){u.voice=v;u.lang=v.lang}else u.lang='vi-VN';
  u.rate=parseFloat($('rate').value);
  u.onend=done;
  speechSynthesis.speak(u);
}
function speak(){
  if(state!=='play')return;
  if(idx>=chunks.length){state='stop';$('prog').style.width='100%';$('status').textContent='Đã đọc xong ✔';$('go').textContent='▶ Bắt đầu';return}
  ui();
  var my=++token;
  say(chunks[idx],my,function(){
    var r=Math.max(1,parseInt($('rep').value)||1);
    rep++;
    if(rep<r){timer=setTimeout(speak,(parseFloat($('p1').value)||0)*1000);return}
    rep=0;
    var br=breaks[idx]||0;
    var after=function(){idx++;timer=setTimeout(speak,(parseFloat($('p2').value)||0)*1000)};
    if(br>0){
      var label=br>1?'xuống đoạn mới':'xuống dòng';
      $('nl').textContent=(br>1?'¶ ':'↵ ')+label.charAt(0).toUpperCase()+label.slice(1);
      if($('sayNl').checked)say(label,my,after);else after();
    }else after();
  });
}
function halt(){token++;clearTimeout(timer);clearTimeout(wd);if(player){player.onended=null;player.onerror=null;player.pause()}if('speechSynthesis' in window)speechSynthesis.cancel()}
function startPlay(){
  halt();
  var r=build();
  if(r!==true){chunks=[];ui();$('status').textContent=r;return}
  idx=0;rep=0;
  if(!chunks.length){$('status').textContent='Hãy nhập văn bản trước.';return}
  if(!player)player=new Audio();
  state='play';$('go').textContent='↻ Bắt đầu lại';$('pz').textContent='⏸ Tạm dừng';speak();
}
function pauseResume(){
  if(state==='play'){state='pause';halt();$('pz').textContent='▶ Tiếp tục';$('status').textContent+=' · tạm dừng'}
  else if(state==='pause'){state='play';$('pz').textContent='⏸ Tạm dừng';speak()}
}
function stopAll(){halt();state='stop';idx=0;rep=0;$('pz').textContent='⏸ Tạm dừng';$('go').textContent='▶ Bắt đầu';ui()}
function jump(d){
  if(!chunks.length)return;
  var was=state;halt();idx=Math.max(0,Math.min(chunks.length-1,idx+d));rep=0;ui();
  if(was==='play'){state='play';speak()}
}
function next(){jump(1)}
function prev(){jump(-1)}

function b64u(b){var s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';var b=atob(str),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function pipe(bytes,stream){var rs=new Blob([bytes]).stream().pipeThrough(stream);return new Uint8Array(await new Response(rs).arrayBuffer())}
async function makeLink(){
  var t=$('text').value.trim();
  if(!t){$('shmsg').textContent='Hãy nhập văn bản trước.';return}
  var data=JSON.stringify({t:t,n:$('min').value,r:$('rep').value,a:$('p1').value,b:$('p2').value,s:$('rate').value,k:$('kw').value});
  var bytes=new TextEncoder().encode(data),tag='t';
  try{if(window.CompressionStream){bytes=await pipe(bytes,new CompressionStream('deflate-raw'));tag='d'}}catch(e){bytes=new TextEncoder().encode(data);tag='t'}
  var link=location.href.split('#')[0]+'#'+tag+'='+b64u(bytes);
  $('link').value=link;
  $('shmsg').textContent=link.length>8000?'Link khá dài ('+link.length+' ký tự), một số ứng dụng chat có thể cắt bớt. Nên chia văn bản ngắn hơn.':'Đã tạo link. Ai mở link này sẽ thấy đúng văn bản của bạn.';
  copyLink();
}
function copyLink(){
  var el=$('link');if(!el.value)return;
  el.select();
  var ok=function(){$('cp').textContent='Đã chép ✔';setTimeout(function(){$('cp').textContent='Sao chép'},1500)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(el.value).then(ok,function(){try{document.execCommand('copy');ok()}catch(e){}})}
  else{try{document.execCommand('copy');ok()}catch(e){}}
}
async function loadFromHash(){
  var h=location.hash.slice(1);if(h.length<3)return;
  try{
    var tag=h[0],bytes=unb64u(h.slice(2));
    if(tag==='d')bytes=await pipe(bytes,new DecompressionStream('deflate-raw'));
    var o=JSON.parse(new TextDecoder().decode(bytes));
    $('text').value=o.t||'';
    if(o.n)$('min').value=o.n;if(o.r)$('rep').value=o.r;
    if(o.a!=null)$('p1').value=o.a;if(o.b!=null)$('p2').value=o.b;
    if(o.s){$('rate').value=o.s;$('rv').textContent=o.s}
    if(o.k)$('kw').value=o.k;
    $('shmsg').textContent='Đã tải văn bản từ link chia sẻ.';
  }catch(e){$('shmsg').textContent='Link chia sẻ không hợp lệ hoặc bị cắt mất một phần.'}
}
loadFromHash();
window.addEventListener('hashchange',loadFromHash);
</script>
</body>
</html>
